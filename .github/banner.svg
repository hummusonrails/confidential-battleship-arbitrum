<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1018"/>
      <stop offset="50%" stop-color="#213147"/>
      <stop offset="100%" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12AAFF"/>
      <stop offset="50%" stop-color="#9DCCED"/>
      <stop offset="100%" stop-color="#12AAFF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12AAFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#12AAFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#12AAFF" stroke-width="0.5" fill="none">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>
  <ellipse cx="640" cy="0" rx="500" ry="200" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#accent)" opacity="0.6"/>
  <rect x="0" y="318" width="1280" height="2" fill="url(#accent)" opacity="0.3"/>

  <!-- Board glyph: a sunk ship, a hit and a miss -->
  <g transform="translate(110, 96)">
    <rect x="2" y="2" width="124" height="124" rx="12" fill="#ffffff"/>
    <rect x="33" y="33" width="93" height="31" fill="#6aaa64"/>
    <rect x="64" y="64" width="31" height="31" fill="#c9b458"/>
    <rect x="33" y="95" width="31" height="31" fill="#787c7e"/>
    <path d="M33 4v120M64 4v120M95 4v120M4 33h120M4 64h120M4 95h120" stroke="#121212" stroke-width="4"/>
    <rect x="2" y="2" width="124" height="124" rx="12" fill="none" stroke="#121212" stroke-width="5"/>
  </g>

  <text x="700" y="120" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">
    Confidential Battleship on Arbitrum
  </text>
  <text x="700" y="170" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400" fill="#9DCCED">
    A hidden fleet computed under FHE with Fhenix CoFHE, about 2 seconds a shot
  </text>

  <g transform="translate(732, 220)" text-anchor="middle"
     font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="13" font-weight="500">
    <rect x="-357" y="-16" width="94" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="-310" y="4" fill="#12AAFF">Arbitrum</text>
    <rect x="-253" y="-16" width="118" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="-194" y="4" fill="#12AAFF">Fhenix CoFHE</text>
    <rect x="-125" y="-16" width="76" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="-87" y="4" fill="#12AAFF">FHE.sol</text>
    <rect x="-39" y="-16" width="86" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="4" y="4" fill="#12AAFF">Solidity</text>
    <rect x="57" y="-16" width="70" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="92" y="4" fill="#12AAFF">React</text>
    <rect x="137" y="-16" width="62" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="168" y="4" fill="#12AAFF">viem</text>
    <rect x="209" y="-16" width="84" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="251" y="4" fill="#12AAFF">Foundry</text>
  </g>
</svg>
